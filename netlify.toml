[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Proxy demo files to the original benniejiga.pro site
[[redirects]]
  from = "/demo/*"
  to = "https://benniejiga.pro/demo/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/Multiple_POV_Scenario/*"
  to = "https://benniejiga.pro/Multiple_POV_Scenario/:splat"
  status = 200
  force = true
